name: Compose smoke test

on:
  push:
    branches: [feature/compose-smoke-validation]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the exact DVC sample
        run: |
          sample=data/processed/meteorites_sample.csv
          curl --fail --silent --show-error --location --retry 3 \
            https://dagshub.com/speter9701/MLSecOps_MeteoriteLandings/raw/main/data/processed/meteorites_sample.csv \
            --output "$sample"
          grep -A2 "path: $sample" dvc.lock | tail -n 1 | awk -v file="$sample" '{print $2 "  " file}' | md5sum --check
          chmod a+r "$sample"

      - name: Start the entire stack
        run: |
          mkdir -p evidence
          docker compose config --quiet
          docker compose up -d
          docker compose ps --all | tee evidence/compose-status.txt

      - name: Check the serving champion and send a prediction
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee evidence/api-health.json
          jq -e '.champion == true' evidence/api-health.json
          curl --fail --silent --show-error http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            --data '{"records":[{"recclass":"L6","fall":"Found","year":1998,"reclat":-76.7,"reclong":159.4}]}' \
            | tee evidence/prediction.json
          jq -e '.predictions | length == 1' evidence/prediction.json
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 \
            http://localhost:8501/_stcore/health | tee evidence/streamlit-health.txt
          docker compose exec -T streamlit python -c '
          from meteorite.config import Settings
          from meteorite.monitoring.drift import evaluate_drift, load_current, load_reference
          from meteorite.prediction_log import PredictionLogger
          current = load_current(PredictionLogger.from_env().path)
          assert current is not None
          result = evaluate_drift(load_reference(Settings.from_env().data_path), current)
          assert "<html" in result.html().lower()
          print(result.summary)
          ' | tee evidence/drift-report.txt

      - name: Trigger the Airflow DAG and wait for success
        run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 --max-time 5 \
            http://localhost:8080/ --output /dev/null
          docker compose exec -T airflow python -c '
          import sqlite3
          import time

          with sqlite3.connect("file:/opt/airflow/airflow.db?mode=ro", uri=True) as database:
              for attempt in range(24):
                  row = database.execute(
                      "SELECT dag_id FROM serialized_dag WHERE dag_id = ?",
                      ("retrain_meteorite_model",),
                  ).fetchone()
                  if row:
                      print(f"Airflow loaded {row[0]}")
                      break
                  time.sleep(5)
              else:
                  raise SystemExit("Airflow did not load the retraining DAG.")
          ' | tee evidence/airflow-dag.txt
          docker compose exec -T airflow airflow dags trigger retrain_meteorite_model --run-id compose-smoke
          for attempt in $(seq 1 48); do
            state=$(docker compose exec -T airflow python -c '
          import sqlite3
          with sqlite3.connect("file:/opt/airflow/airflow.db?mode=ro", uri=True) as database:
              result = database.execute("SELECT state FROM dag_run WHERE run_id = ?", ("compose-smoke",)).fetchone()
              print(result[0] if result else "missing")
          ')
            printf 'Airflow compose-smoke: %s\n' "$state" | tee evidence/airflow-result.txt
            case "$state" in
              success) exit 0 ;;
              failed) exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      - name: Record final container state
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps --all | tee evidence/compose-status-final.txt

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-evidence
          path: evidence/

      - name: Stop the isolated test stack
        if: always()
        run: docker compose down --volumes
